[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-dev-harness"
version = "0.2.0"
description = "Agent-neutral delivery harness for gated Java/Spring/Maven requirement implementation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "E2E Dev Harness Maintainers" }]
license = { text = "Proprietary" }
keywords = ["agent", "harness", "tdd", "java", "spring", "maven", "gitnexus"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ast = ["tree_sitter>=0.22", "tree_sitter_java>=0.21"]

[project.scripts]
e2e-dev-harness = "e2e_dev_harness:main"
e2e_dev_harness = "e2e_dev_harness:main"
e2eh = "e2e_dev_harness:main"
e2e-harness = "e2e_dev_harness:main"

[tool.setuptools]
package-dir = { "" = "skills/e2e-dev-harness/scripts" }
packages = { find = { where = ["skills/e2e-dev-harness/scripts"], include = ["e2e_harness*"] } }
py-modules = [
  "ac_progress_gate",
  "agent_instructions",
  "agent_scheduler",
  "artifact_registry",
  "ask_user_bridge",
  "auto_transition",
  "checkpoint_gate",
  "clarification_gate",
  "command_evidence",
  "common",
  "context_pack",
  "contract_gate",
  "coordinator_flow",
  "coordinator_summary",
  "coverage_gate",
  "cross_service_dependency_scan",
  "dispatcher",
  "e2e_dev_harness",
  "event_log",
  "execution_trace",
  "handoff_gate",
  "harness_doctor",
  "harness_stop_guard",
  "harness_policy",
  "harness_verify",
  "implementation_gate",
  "implementation_manifest",
  "install_hooks",
  "kg_refresh",
  "lifecycle_policy",
  "memory_capture",
  "orchestration_plan",
  "output_contract",
  "phase_guard",
  "plugin_registry",
  "preflight",
  "requirements_archive",
  "reviewer_gate",
  "rework_gate",
  "run_state",
  "run_summary",
  "runtime_adapters",
  "session_checkpoint",
  "service_design_gate",
  "spring_static_check",
  "superpowers_probe",
  "task_alignment_guard",
  "task_tier",
  "tdd_evidence",
  "test_impact_plan",
  "workflow_guard",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep ruff's default rule set (E4/E7/E9 + Pyflakes "F"). This repo depends on:
#   * F401 (unused-import) to catch the recurring dead imports left behind by
#     CLI-thinning refactors. Genuine re-export / monkeypatch targets are kept
#     with an explicit `# noqa: F401`, never auto-deleted (do NOT run
#     `ruff check --fix` blindly on e2e_dev_harness.py — it would strip them).
#   * E402 (module-import-not-at-top), suppressed deliberately with `# noqa: E402`
#     where imports follow runtime sys.path setup. Do not remove those noqas.
select = ["E4", "E7", "E9", "F"]

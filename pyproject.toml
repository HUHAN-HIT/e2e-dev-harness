[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-dev-harness"
version = "0.2.0"
description = "Agent-neutral multi-agent delivery harness: SSOT run-state, declarative tier-scaled gates, domain adapters, worker subagents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
authors = [{ name = "E2E Dev Harness Maintainers" }]
license = { text = "Proprietary" }
keywords = ["agent", "harness", "tdd", "java", "spring", "maven", "gitnexus"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ast = ["tree_sitter>=0.22", "tree_sitter_java>=0.21"]

[project.scripts]
e2e-dev-harness = "e2e_harness.cli.main:main"
e2eh = "e2e_harness.cli.main:main"

[tool.setuptools]
package-dir = { "" = "skills/e2e-dev-harness/scripts" }
packages = { find = { where = ["skills/e2e-dev-harness/scripts"], include = ["e2e_harness*"] } }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep ruff's default rule set (E4/E7/E9 + Pyflakes "F"). This repo depends on:
#   * F401 (unused-import) to catch the recurring dead imports left behind by
#     CLI-thinning refactors. Genuine re-export / monkeypatch targets are kept
#     with an explicit `# noqa: F401`, never auto-deleted (do NOT run
#     `ruff check --fix` blindly on e2e_dev_harness.py — it would strip them).
#   * E402 (module-import-not-at-top), suppressed deliberately with `# noqa: E402`
#     where imports follow runtime sys.path setup. Do not remove those noqas.
select = ["E4", "E7", "E9", "F"]

display_name: E2E Dev Workflow
short_description: End-to-end clarified TDD delivery workflow.
default_prompt: Use this skill to drive an end-to-end development workflow: run the unified prepare CLI, load AGENT instructions in two phases (discovery root rules before clarification, then affected service rules after the design narrows services), scan and validate project memory, select phase/service-scoped memory for agents, use discovery orchestration only for a lean service inventory, choose single-agent or multi-agent orchestration after affected services are known, create an ExecPlan for complex work, apply Superpowers clarification when available, refresh the repository knowledge graph, pass planning/implementation/completion gates, then implement with superpowers:test-driven-development. For multi-service work, split service implementation plans and code agents only for affected services. At completion, handle proposed memory updates before promoting accepted facts. The bundled scaffold and test guidance are currently tuned for Java 21, Spring Framework 6.x, and Maven without Spring Boot.

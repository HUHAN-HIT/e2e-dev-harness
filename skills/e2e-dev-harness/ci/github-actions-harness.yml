name: E2E Dev Harness

on:
  pull_request:
  workflow_dispatch:

jobs:
  harness-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Replay harness run
        shell: pwsh
        run: |
          python skills/e2e-dev-harness/scripts/e2e_dev_harness.py verify . `
            --harness `
            --strict-workflow `
            --workflow-tier critical `
            --state "$env:HARNESS_RUN_STATE" `
            --strict-artifacts `
            --summary-json "$env:HARNESS_RUN_SUMMARY_JSON" `
            --summary-md "$env:HARNESS_RUN_SUMMARY_MD" `
            --json
        env:
          HARNESS_RUN_STATE: docs/agent-runs/<run>/run-state.json
          HARNESS_RUN_SUMMARY_JSON: docs/agent-runs/<run>/run-summary.json
          HARNESS_RUN_SUMMARY_MD: docs/agent-runs/<run>/run-summary.md

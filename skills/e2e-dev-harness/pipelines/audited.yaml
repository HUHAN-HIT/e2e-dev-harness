name: audited
phases:
  - CREATED
  - CLARIFIED
  - PLANNED
  - RED
  - phase: IMPLEMENTED
    allows_code_write: true
  - phase: REVIEWED
    produces: [r1_review, r2_review, r3_review]
    exit_gate: [r1_review, r2_review, r3_review]
  - phase: VERIFIED
    produces: [verification, audit_replay, agent_team_dispatch]
    exit_gate: [verification, audit_replay, agent_team_dispatch]
